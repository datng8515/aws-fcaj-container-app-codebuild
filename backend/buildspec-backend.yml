version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - |
        set -euo pipefail
        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y jq
          else
            echo "jq is required; use a CodeBuild Linux image with apt-get or install jq in the image." >&2
            exit 1
          fi
        fi

  pre_build:
    commands:
      - |
        set -euo pipefail

        AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
        export AWS_REGION AWS_DEFAULT_REGION="$AWS_REGION"

        if [[ -z "${IMAGE_TAG:-}" ]]; then
          if [[ "${CODEBUILD_WEBHOOK_HEAD_REF:-}" == refs/tags/* ]]; then
            IMAGE_TAG="${CODEBUILD_WEBHOOK_HEAD_REF#refs/tags/}"
          elif [[ "${CODEBUILD_WEBHOOK_TRIGGER:-}" == tag/* ]]; then
            IMAGE_TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}"
          else
            echo "This build was not triggered by a Git tag. Set IMAGE_TAG only for an intentional manual build." >&2
            exit 1
          fi
        fi
        if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "IMAGE_TAG '$IMAGE_TAG' is not a valid Docker image tag." >&2
          exit 1
        fi
        export IMAGE_TAG

        AWS_ACCOUNT_NUMBER="${AWS_ACCOUNT_NUMBER:-$(aws sts get-caller-identity --query Account --output text)}"
        export AWS_ACCOUNT_NUMBER

        for name in AWS_REGION CI_PROJECT_BE_NAME TASK_NAME_BE CLUSTER_NAME SERVICE_NAME_BE; do
          if [[ -z "${!name:-}" ]]; then
            echo "Required environment variable $name is not set." >&2
            exit 1
          fi
        done

        IMAGE_NAME_BE="${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CI_PROJECT_BE_NAME}:${IMAGE_TAG}"
        export IMAGE_NAME_BE

        echo "Logging in to ECR in ${AWS_REGION}..."
        aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS --password-stdin \
              "${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com"

  build:
    commands:
      - docker build -f backend/Dockerfile -t "$IMAGE_NAME_BE" backend

  post_build:
    commands:
      - |
        set -euo pipefail
        docker push "$IMAGE_NAME_BE"
        bash backend/deploy-backend.sh

artifacts:
  files: []
