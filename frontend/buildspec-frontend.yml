version: 0.2

env:
  shell: /bin/sh

phases:
  install:
    commands:
      - |
        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y && apt-get install -y jq
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y jq
          elif command -v yum >/dev/null 2>&1; then
            yum install -y jq
          else
            echo "Install jq in the CodeBuild image." >&2
            exit 1
          fi
        fi

  pre_build:
    commands:
      - |
        IMAGE_TAG="${IMAGE_TAG:-}"
        if [ -z "$IMAGE_TAG" ]; then
          case "${CODEBUILD_WEBHOOK_HEAD_REF:-}" in
            refs/tags/*) IMAGE_TAG="${CODEBUILD_WEBHOOK_HEAD_REF#refs/tags/}" ;;
            *)
              case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
                tag/*) IMAGE_TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}" ;;
                *) echo "Trigger CodeBuild from a GitHub tag or set IMAGE_TAG." >&2; exit 1 ;;
              esac
              ;;
          esac
        fi

        AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
        : "${AWS_REGION:?Set AWS_REGION in the CodeBuild project.}"
        : "${CI_PROJECT_FE_NAME:?Set CI_PROJECT_FE_NAME in the CodeBuild project.}"
        : "${TASK_NAME_FE:?Set TASK_NAME_FE in the CodeBuild project.}"
        : "${CLUSTER_NAME:?Set CLUSTER_NAME in the CodeBuild project.}"
        : "${SERVICE_NAME_FE:?Set SERVICE_NAME_FE in the CodeBuild project.}"

        AWS_ACCOUNT_NUMBER="${AWS_ACCOUNT_NUMBER:-$(aws sts get-caller-identity --query Account --output text)}" || exit 1
        ECR_REGISTRY="${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        IMAGE_NAME_FE="${ECR_REGISTRY}/${CI_PROJECT_FE_NAME}:${IMAGE_TAG}"
        export AWS_REGION AWS_DEFAULT_REGION="$AWS_REGION" IMAGE_NAME_FE

        ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION") || exit 1
        printf '%s' "$ECR_PASSWORD" | docker login --username AWS --password-stdin "$ECR_REGISTRY" || exit 1
        unset ECR_PASSWORD

  build:
    commands:
      - docker build -f frontend/Dockerfile.prod -t "$IMAGE_NAME_FE" frontend

  post_build:
    commands:
      - docker push "$IMAGE_NAME_FE"
      - bash frontend/deploy-frontend.sh
