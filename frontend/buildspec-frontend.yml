version: 0.2

env:
  shell: /bin/sh

phases:
  install:
    commands:
      - |
        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y && apt-get install -y jq
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y jq
          elif command -v yum >/dev/null 2>&1; then
            yum install -y jq
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache jq
          else
            echo "jq is required; install it in the CodeBuild image or use a supported Linux package manager." >&2
            exit 1
          fi
        fi
      - command -v jq

  pre_build:
    commands:
      - echo "Resolving the image tag and AWS settings..."
      - AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
      - export AWS_REGION AWS_DEFAULT_REGION="$AWS_REGION"
      - |
        if [ -z "${IMAGE_TAG:-}" ]; then
          case "${CODEBUILD_WEBHOOK_HEAD_REF:-}" in
            refs/tags/*) IMAGE_TAG="${CODEBUILD_WEBHOOK_HEAD_REF#refs/tags/}" ;;
            *)
              case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
                tag/*) IMAGE_TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}" ;;
                *)
                  echo "This build was not triggered by a Git tag. Set IMAGE_TAG only for an intentional manual build." >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
        fi
      - |
        if ! printf '%s\n' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
          echo "IMAGE_TAG '$IMAGE_TAG' is not a valid Docker image tag." >&2
          exit 1
        fi
      - export IMAGE_TAG
      - if [ -z "$AWS_REGION" ]; then echo "Required environment variable AWS_REGION is not set." >&2; exit 1; fi
      - if [ -z "${CI_PROJECT_FE_NAME:-}" ]; then echo "Required environment variable CI_PROJECT_FE_NAME is not set." >&2; exit 1; fi
      - if [ -z "${TASK_NAME_FE:-}" ]; then echo "Required environment variable TASK_NAME_FE is not set." >&2; exit 1; fi
      - if [ -z "${CLUSTER_NAME:-}" ]; then echo "Required environment variable CLUSTER_NAME is not set." >&2; exit 1; fi
      - if [ -z "${SERVICE_NAME_FE:-}" ]; then echo "Required environment variable SERVICE_NAME_FE is not set." >&2; exit 1; fi
      - AWS_ACCOUNT_NUMBER="${AWS_ACCOUNT_NUMBER:-$(aws sts get-caller-identity --query Account --output text)}" || exit $?
      - export AWS_ACCOUNT_NUMBER
      - IMAGE_NAME_FE="${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CI_PROJECT_FE_NAME}:${IMAGE_TAG}"
      - export IMAGE_NAME_FE
      - echo "Logging in to ECR in ${AWS_REGION}..."
      - ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION") || exit $?
      - printf '%s' "$ECR_PASSWORD" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - unset ECR_PASSWORD

  build:
    commands:
      - docker build -f frontend/Dockerfile.prod -t "$IMAGE_NAME_FE" frontend

  post_build:
    commands:
      - echo "Pushing frontend image: $IMAGE_NAME_FE"
      - docker push "$IMAGE_NAME_FE"
      - echo "Deploying frontend to ECS..."
      - |
        bash frontend/deploy-frontend.sh

artifacts:
  files: []
