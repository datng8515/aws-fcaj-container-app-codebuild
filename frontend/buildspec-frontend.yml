version: 0.2

env:
  shell: /bin/sh

phases:
  install:
    commands:
      - |
        set -eu
        if ! command -v jq >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -y
            apt-get install -y jq
          else
            echo "jq is required; use a CodeBuild Linux image with apt-get or install jq in the image." >&2
            exit 1
          fi
        fi

  pre_build:
    commands:
      - |
        set -eu

        AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"
        export AWS_REGION AWS_DEFAULT_REGION="$AWS_REGION"

        if [ -z "${IMAGE_TAG:-}" ]; then
          case "${CODEBUILD_WEBHOOK_HEAD_REF:-}" in
            refs/tags/*) IMAGE_TAG="${CODEBUILD_WEBHOOK_HEAD_REF#refs/tags/}" ;;
            *)
              case "${CODEBUILD_WEBHOOK_TRIGGER:-}" in
                tag/*) IMAGE_TAG="${CODEBUILD_WEBHOOK_TRIGGER#tag/}" ;;
                *)
                  echo "This build was not triggered by a Git tag. Set IMAGE_TAG only for an intentional manual build." >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
        fi
        if ! printf '%s\n' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
          echo "IMAGE_TAG '$IMAGE_TAG' is not a valid Docker image tag." >&2
          exit 1
        fi
        export IMAGE_TAG

        AWS_ACCOUNT_NUMBER="${AWS_ACCOUNT_NUMBER:-$(aws sts get-caller-identity --query Account --output text)}"
        export AWS_ACCOUNT_NUMBER

        require_value() {
          if [ -z "$2" ]; then
            echo "Required environment variable $1 is not set." >&2
            exit 1
          fi
        }
        require_value AWS_REGION "$AWS_REGION"
        require_value CI_PROJECT_FE_NAME "${CI_PROJECT_FE_NAME:-}"
        require_value TASK_NAME_FE "${TASK_NAME_FE:-}"
        require_value CLUSTER_NAME "${CLUSTER_NAME:-}"
        require_value SERVICE_NAME_FE "${SERVICE_NAME_FE:-}"

        IMAGE_NAME_FE="${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com/${CI_PROJECT_FE_NAME}:${IMAGE_TAG}"
        export IMAGE_NAME_FE

        echo "Logging in to ECR in ${AWS_REGION}..."
        ECR_PASSWORD=$(aws ecr get-login-password --region "$AWS_REGION")
        printf '%s' "$ECR_PASSWORD" | docker login --username AWS --password-stdin \
          "${AWS_ACCOUNT_NUMBER}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        unset ECR_PASSWORD

  build:
    commands:
      - docker build -f frontend/Dockerfile.prod -t "$IMAGE_NAME_FE" frontend

  post_build:
    commands:
      - |
        set -eu
        docker push "$IMAGE_NAME_FE"
        bash frontend/deploy-frontend.sh

artifacts:
  files: []
